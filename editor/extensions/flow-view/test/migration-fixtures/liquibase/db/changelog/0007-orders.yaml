databaseChangeLog:
  - changeSet:
      id: 7
      author: a
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: key
                  type: varchar(40)
        - dropColumn:
            tableName: orders
            columnName: legacy_ref
        - createTable:
            tableName: order_notes
            columns:
              - column:
                  name: id
                  type: bigint
              - column:
                  name: body
                  type: text
        - renameTable:
            oldTableName: order_notes
            newTableName: notes
      rollback:
        - dropTable:
            tableName: order_notes
