# Asks every outside contributor to sign CLA.md once, on their first pull request, by commenting a fixed sentence.
# Signatures are kept as JSON on the cla-signatures branch (not main, so the bot's commits stay out of the history).
# pull_request_target runs with this repository's token but never checks out the pull request's code, so a fork cannot
# run anything here; the action only reads the PR's author and commits.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/bothuany/axle/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer's own accounts and bots do not need to sign. `claude` is the account GitHub resolves the Claude Code co-author trailer to.
          allowlist: bothuany,claude,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: 'Thanks for your pull request! Before it can be merged, please read the [Contributor License Agreement](https://github.com/bothuany/axle/blob/main/CLA.md) and sign it by commenting the sentence below. You only do this once.'
