# Asks every outside contributor to sign CLA.md once, on their first pull request, by commenting a fixed sentence.
# Signatures are kept as JSON on the cla-signatures branch (not main, so the bot's commits stay out of the history).
# pull_request_target runs with this repository's token but never checks out the pull request's code, so a fork cannot
# run anything here; the action only reads the PR's author and commits.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/bothuany/insilode/blob/main/CLA.md
          branch: cla-signatures
          # Who need not sign depends on who opened the pull request. The action checks each commit's author (else its committer),
          # which anyone can set: a commit whose email GitHub resolves to bothuany, a bot or `claude` would skip the check. So the
          # list applies only to pull requests the maintainer or Dependabot opened, where commits authored by Claude Code (the
          # `claude` account) are the maintainer's own work. On anyone else's pull request every commit author signs, and nobody
          # is allowlisted. Co-authored-by trailers are never read by the action, so a contributor's own commits with a Claude
          # co-author trailer need only the contributor's signature.
          allowlist: ${{ contains(fromJSON('["bothuany", "dependabot[bot]"]'), github.event.pull_request.user.login || github.event.issue.user.login) && 'bothuany,claude,dependabot[bot],github-actions[bot]' || '' }}
          custom-notsigned-prcomment: 'Thanks for your pull request! Before it can be merged, please read the [Contributor License Agreement](https://github.com/bothuany/insilode/blob/main/CLA.md) and sign it by commenting the sentence below. You only do this once.'
