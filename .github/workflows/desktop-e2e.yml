# Desktop end-to-end tests: Axle's real Electron app, driven by Playwright (test/e2e-desktop), on machines that are not anyone's desktop.
#   unit      the harness itself (sandbox config, installer command lines, result table): seconds
#   windows   builds the installer, then runs test/e2e-desktop/sandbox/run-in-sandbox.ps1: the same script Windows Sandbox runs
#             locally (npm run sandbox:e2e). Silent install, the app scenarios on the installed build, the in-app update against a
#             local static server (AXLE_UPDATE_URL), uninstall.
#   linux     the app from source under xvfb: branding and onboarding, the canvas and a tour, the status island
#   report    one PR comment (created once, then updated): pass/fail table and a screenshot gallery; the screenshots go to the
#             e2e-shots branch, which nothing else uses
# The builds are the expensive part (a first run is 60 to 90 minutes, the VS Code checkout and the packaged app are then cached
# and a run takes 15 to 30). UI-only checks never come here: they run headless in web mode (.claude/skills/probe).
name: desktop-e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: harness unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - run: npm run test:e2e-unit

      - name: The in-sandbox script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/test/e2e-desktop/sandbox/run-in-sandbox.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  windows:
    name: Windows (installed build)
    # windows-2022 rather than windows-latest (Visual Studio 2026): VS Code 1.141's preinstall accepts only Visual Studio 2019 and
    # 2022, as release.yml does. Move on with it.
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$vsInstaller\vswhere.exe" -latest -products * -property installationPath
          Start-Process -Wait -FilePath "$vsInstaller\vs_installer.exe" -ArgumentList 'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart', '--nocache'

      # The VS Code checkout and its production build change only with VS Code's version, the core patches, product.json and the
      # icon (that is what `npm run installer -- --fast` stamps), so they are restored and Axle's own parts are rebuilt on top.
      - name: Cache the VS Code build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            editor/vscode
            editor/VSCode-win32-x64
            dist/app-build.stamp
          key: desktop-e2e-win-${{ hashFiles('scripts/setup.mjs', 'scripts/installer.mjs', 'scripts/lib.mjs', 'editor/patches/**', 'editor/installer/**') }}

      - name: Set up Axle
        run: npm run setup

      - name: Build the installer
        run: npm run installer -- --fast

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axle-installer
          path: dist/Axle-Setup-*.exe
          retention-days: 3

      - name: Test dependencies
        working-directory: test/e2e-desktop
        run: npm ci --no-audit --no-fund

      # The folder Windows Sandbox would map: installer, node.exe, the test code.
      - name: Stage
        run: node scripts/sandbox-e2e.mjs --stage "$RUNNER_TEMP/axle-stage"

      # The script Windows Sandbox runs at logon, run here on the runner: it is one script, so CI exercises what a local run does.
      - name: Scenarios
        shell: pwsh
        run: ./test/e2e-desktop/sandbox/run-in-sandbox.ps1 -In "$env:RUNNER_TEMP/axle-stage" -Out "$PWD/e2e-out" -Label windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-windows
          path: e2e-out
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (from source, xvfb)
    # 22.04 and clang, as release.yml: the native modules do not compile with 22.04's GCC.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Linux build tools, a display and the libraries Electron loads
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev clang-15 libstdc++-12-dev \
            xvfb xdotool libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2 libxkbcommon0
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Cache the VS Code checkout
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: editor/vscode
          key: desktop-e2e-linux-${{ hashFiles('scripts/setup.mjs', 'scripts/lib.mjs', 'editor/patches/**') }}

      - name: Set up Axle
        run: npm run setup

      - name: Test dependencies
        working-directory: test/e2e-desktop
        run: npm ci --no-audit --no-fund

      - name: Scenarios
        env:
          AXLE_E2E_ISOLATED: '1'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node test/e2e-desktop/run.mjs --label linux --out e2e-out --source editor/vscode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-linux
          path: e2e-out
          if-no-files-found: error
          retention-days: 14

  report:
    name: PR comment
    needs: [unit, windows, linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # contents: the screenshots branch. A fork's token cannot write either: the comment then links the artifacts and the job summary has the table.
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-*
          path: e2e-results

      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          publish=--publish
          [ "$FORK" = "true" ] && publish=
          node test/e2e-desktop/comment.mjs --in e2e-results --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" ${PR:+--pr "$PR"} $publish
