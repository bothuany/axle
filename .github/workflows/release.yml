# Builds Insilode when a version tag is pushed and attaches the result to the GitHub release:
#   Windows  the installer (npm run installer)                      Insilode-Setup-<version>-x64.exe
#   macOS    the app for Apple silicon and Intel (npm run package)  Insilode-<version>-darwin-{arm64,x64}.{zip,dmg}
#   Linux    the Debian package, an RPM and a tarball               insilode_<version>_amd64.deb, insilode-<version>-1.x86_64.rpm, Insilode-<version>-linux-x64.tar.gz
# plus SHA256SUMS.txt over all of them (what packaging/homebrew/insilode.rb and packaging/winget need) and the
# update-<platform>-insilode.json files that a running Insilode reads to learn of this release (scripts/update-manifests.mjs,
# packaging/README.md "Updates").
# Each build needs the full `npm run setup` (a VS Code checkout, `npm ci`, native modules) and VS Code's production build,
# so it is slow: plan for 60 to 90 minutes. A manual run (no tag) keeps the files as build artifacts instead.
# Only the Windows build has been run by hand; the macOS and Linux jobs are first tested by a tag (or a manual run).
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the release once, before the builds, so that parallel jobs do not race to create it.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}: the packages would be named for ${version}."
            exit 1
          fi

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Insilode ${GITHUB_REF_NAME#v}" --generate-notes

  installer:
    name: Windows installer
    needs: release
    # windows-2022 rather than windows-latest (Visual Studio 2026): VS Code 1.141's preinstall accepts only Visual Studio
    # 2019 and 2022, as VS Code's own Windows CI has. Move on when Insilode moves to a VS Code that knows 2026.
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      # VS Code's native modules are built with the "MSVC Spectre-mitigated libs", which the runner's Visual Studio may not carry.
      - name: Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$vsInstaller\vswhere.exe" -latest -products * -property installationPath
          Start-Process -Wait -FilePath "$vsInstaller\vs_installer.exe" -ArgumentList 'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart', '--nocache'

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}: the installer would be named for ${version}."
            exit 1
          fi

      - name: Set up Insilode
        run: npm run setup

      - name: Build the installer
        run: npm run installer

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Insilode ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/Insilode-Setup-*.exe --clobber

      # A manual run (no tag) keeps the installer as a build artifact instead.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: insilode-installer
          path: dist/Insilode-Setup-*.exe
          retention-days: 7

  packages:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-latest
            arch: arm64
            files: dist/Insilode-*-darwin-arm64.zip dist/Insilode-*-darwin-arm64.dmg
          # An Intel runner, so that the native modules are built for the processor they run on (no cross-compiling).
          - name: macOS (Intel)
            runner: macos-15-intel
            arch: x64
            files: dist/Insilode-*-darwin-x64.zip dist/Insilode-*-darwin-x64.dmg
          # 22.04 rather than ubuntu-latest: the native modules are compiled here and need this machine's glibc (2.35) or
          # newer, so the .deb also installs on Ubuntu 22.04 and Debian 12. Move to ubuntu-latest when 22.04 is retired.
          - name: Linux (x64)
            runner: ubuntu-22.04
            arch: x64
            files: dist/insilode_*_amd64.deb dist/insilode-*.rpm dist/Insilode-*-linux-x64.tar.gz
    defaults:
      run:
        shell: bash
    env:
      # VS Code's build downloads Electron, built-in extensions and (Linux) sysroots from GitHub: authenticated, it is not rate limited.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The runner has about 14 GB free and the build needs about 20: toolchains Insilode does not use go first.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm clang-15 libstdc++-12-dev
          # Electron's V8 headers do not compile with 22.04's GCC 11 (nor GCC 12): the native modules are built with clang,
          # as VS Code's own Linux build does. libstdc++-12-dev, because clang takes the newest GCC it finds for its headers.
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
          clang++-15 -v 2>&1 | grep 'Selected GCC'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Insilode
        run: npm run setup

      # VS Code's deb step fetches Chromium's dpkg-shlibdeps.pl from raw.githubusercontent.com with a plain `curl`, and
      # anonymous requests from runners get "429: Too Many Requests", saved as the script. A curl earlier on PATH sends this
      # job's token to that host only, retries, and fails on an error page instead of saving it; every other URL is untouched.
      - name: Authenticated downloads from raw.githubusercontent.com
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/curl-shim"
          cat > "$RUNNER_TEMP/curl-shim/curl" <<'SHIM'
          #!/usr/bin/env bash
          for arg in "$@"; do
          	case "$arg" in
          	https://raw.githubusercontent.com/*)
          		exec /usr/bin/curl --fail --location --retry 5 --retry-delay 15 --retry-all-errors -H "Authorization: Bearer $GITHUB_TOKEN" "$@" ;;
          	esac
          done
          exec /usr/bin/curl "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/curl-shim/curl"
          echo "$RUNNER_TEMP/curl-shim" >> "$GITHUB_PATH"

      - name: Build the packages
        run: npm run package -- --arch ${{ matrix.arch }}

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ matrix.files }}
        run: |
          shopt -s nullglob
          # The RPM is best effort (scripts/package.mjs): a pattern that matches nothing is left out, not an error.
          files=()
          for file in $FILES; do files+=("$file"); done
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: insilode-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Checksums of everything on the release: the values the Homebrew cask and the winget manifest take.
  checksums:
    name: Checksums
    needs: [installer, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --pattern 'Insilode-*' --pattern 'insilode*'
          sha256sum -- * | tee ../SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" ../SHA256SUMS.txt --clobber

      # After the checksums, and only when every platform's file is on the release: the script fails on a missing one.
      # releases/latest/download serves these files to every running Insilode, which compares productVersion with its own.
      - name: Update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir update-assets update-files
          gh release download "${GITHUB_REF_NAME}" --dir update-assets --pattern 'Insilode-*' --pattern 'insilode_*'
          node scripts/update-manifests.mjs --dir update-assets --out update-files --version "${GITHUB_REF_NAME#v}" --commit "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" update-files/*.json --clobber
