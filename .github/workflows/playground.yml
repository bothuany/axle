# Builds the browser playground (playground/) and publishes it to GitHub Pages on every push to main, so it stays in step with
# the canvas and the index. The owner enables Pages once: Settings, Pages, Source "GitHub Actions". Nothing here changes repo settings.
#   canvas      ui/ type-checks and builds (the playground imports its source and would break with it)
#   index       flow-view's worker is built and run on the demo project (scripts/playground-data.mjs) to make the demo data
#   playground  type-checks against protocol/ (the fake host and the data's readers), then builds the site
name: playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the playground
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            editor/extensions/flow-view/package-lock.json
            playground/package-lock.json

      - name: Canvas
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Index worker
        working-directory: editor/extensions/flow-view
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs

      - name: Demo data from the real index
        run: node scripts/playground-data.mjs

      - name: Playground (type-check, then build)
        working-directory: playground
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: playground/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
