# What can be checked without the VS Code checkout. The extensions' type checks (`npm run typecheck`) extend
# editor/vscode's tsconfig and typings, so they need `npm run setup` (a 10-20 minute job) and stay a local check.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            editor/extensions/*/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - name: Scripts parse
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Analyzer
        run: dotnet build analyzer -nologo -v q

      - name: Canvas
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: flow-view (build and tests)
        working-directory: editor/extensions/flow-view
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: flow-agent (build and tests)
        working-directory: editor/extensions/flow-agent
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs
          npm test

      - name: flow-harness (build and tests)
        working-directory: editor/extensions/flow-harness
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs
          npm test

      # Last, so every package's node_modules exist and the devDependency rule can resolve imports; it still runs when
      # an earlier step failed, so a broken test does not hide an architecture violation.
      - name: Architecture rules (dependency-cruiser, wire types, command contracts)
        if: ${{ !cancelled() }}
        run: |
          npm ci --no-audit --no-fund
          npm run arch

  # The browser playground (playground/), built but not deployed: a change to the canvas, the protocol types or the index that breaks
  # it shows up on the pull request. The deploy to GitHub Pages is playground.yml, on pushes to main.
  playground:
    name: playground builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            editor/extensions/flow-view/package-lock.json
            editor/extensions/flow-harness/package-lock.json
            playground/package-lock.json

      - name: Canvas and index worker
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd editor/extensions/flow-view && npm ci --no-audit --no-fund && node esbuild.mjs)
          (cd editor/extensions/flow-harness && npm ci --no-audit --no-fund)

      - name: Demo data from the real index
        run: node scripts/playground-data.mjs

      - name: Playground (type-check against protocol/, build, play the demo in Chrome)
        working-directory: playground
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run test:e2e

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - name: Install semgrep
        run: pipx install semgrep==1.181.0

      - name: Axle's rules pass their fixtures
        run: semgrep --test --metrics=off .semgrep/rules

      # Same rulesets and policy as `npm run semgrep` locally: ERROR findings fail, WARNING findings are listed.
      - name: Scan
        run: node scripts/semgrep.mjs
