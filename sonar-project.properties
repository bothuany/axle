# Local SonarQube analysis of the TypeScript/JavaScript side: `npm run sonar` (see tools/sonarqube/README.md).
# The C# analyzer is a separate project (axle-analyzer), scanned by `npm run sonar -- --dotnet`.
sonar.projectKey=axle
sonar.projectName=Axle
sonar.sourceEncoding=UTF-8

sonar.sources=editor/extensions/flow-view/src,editor/extensions/flow-view/mcp,editor/extensions/flow-agent/src,editor/extensions/flow-harness/src,ui/src,scripts
sonar.tests=editor/extensions/flow-view/test,editor/extensions/flow-agent/test,test
sonar.test.inclusions=**/*.test.mjs,**/test/**/*.mjs,test/**/*

# Never the VS Code checkout, worktrees, build output, or the sample apps the analyzers parse in tests
sonar.exclusions=editor/vscode/**,.claude/**,brag-output*/**,**/node_modules/**,**/out/**,**/dist/**,**/dist-webview/**,**/*.d.ts,scripts/*.py
sonar.test.exclusions=editor/extensions/flow-view/test/fixtures/**,editor/extensions/flow-view/test/types-fixtures/**,editor/extensions/flow-view/test/expected/**,editor/extensions/flow-view/test/types-expected/**,editor/extensions/flow-view/test/bundle.mjs

# The extension tsconfigs extend the VS Code checkout (editor/vscode); the scanner reads them when it is there.
sonar.typescript.tsconfigPaths=ui/tsconfig.json,editor/extensions/flow-view/tsconfig.json,editor/extensions/flow-agent/tsconfig.json,editor/extensions/flow-harness/tsconfig.json
sonar.javascript.node.maxspace=4096

# Copy-paste detection: the per-language parsers in poly/ are alike by design
sonar.cpd.exclusions=editor/extensions/flow-view/src/poly/java.ts,editor/extensions/flow-view/src/poly/python.ts,editor/extensions/flow-view/src/poly/js.ts,editor/extensions/flow-view/src/poly/others.ts
