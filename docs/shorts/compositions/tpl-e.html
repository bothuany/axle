<!doctype html>
<!-- Template E, "Ride": the camera rides along the real flow, one note per hop (the notes are in the sound track, written by
     tools/episode.mjs from the hop times), a chip lands per hop, and an optional clock runs. The clock is the VIDEO's clock,
     labelled as such; it is not a measurement of the app. The last 2 s ride back to the first frame. -->
<html lang="en" data-composition-variables='[
{"id":"question","type":"string","label":"Question, lines split by |, *accent*","default":"How far does|one request *go*?"},
{"id":"captureUrl","type":"string","label":"Capture","default":"assets/captures/B3-sidebar.jpg"},
{"id":"cam","type":"string","label":"Ride (camera keys JSON)","default":"[{\"t\":0,\"cx\":0.45,\"cy\":0.4,\"w\":0.4}]"},
{"id":"hops","type":"string","label":"Hops (JSON: t, label, ring {cx,cy,w,h})","default":"[]"},
{"id":"timer","type":"string","label":"Clock label (empty: no clock)","default":""},
{"id":"duration","type":"number","label":"Scene length (s)","default":16},
{"id":"loop","type":"number","label":"Loop-back length (s)","default":2}
]'>
<body>
<template id="tpl-e-template">
	<style>
		#root { position: absolute; inset: 0; }
		#e-q { font-size: 84px; }
		#e-panel { left: var(--px); top: 480px; width: var(--pw); height: 810px; }
		#e-chips { position: absolute; left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
		#e-chips .chip { font-size: 32px; background: rgba(12, 16, 32, .92); }
		#e-clock { position: absolute; right: 22px; top: 22px; padding: 10px 22px 12px; text-align: right; }
		#e-clock b { display: block; font-family: var(--mono); font-weight: 700; font-size: 52px; line-height: 1.1; color: var(--ink); }
		#e-clock span { font-size: 28px; color: var(--ink-2); }
	</style>
	<div id="root" data-composition-id="tpl-e" data-width="1080" data-height="1920">
		<div class="demo">demo project</div>
		<div id="e-q" class="q hl"></div>
		<div id="e-panel" class="panel">
			<div id="e-cam" class="cam" data-layout-allow-overflow><img data-var-src="captureUrl" src="assets/blank.png#e" alt=""></div>
			<div id="e-clock" class="plate"><b id="e-time">00:00.0</b><span id="e-tlab"></span></div>
			<div id="e-chips"></div>
		</div>
	</div>
	<script>
		(function () {
			var V = Shorts.vars('tpl-e'), S = Shorts
			var dur = V.duration, loop = V.loop, cut = dur - loop
			var tl = gsap.timeline({ paused: true })
			var $ = function (id) { return document.getElementById(id) }
			S.lines($('e-q'), V.question, 'e-q')
			var keys = S.json(V.cam, [])
			var last = keys[keys.length - 1]
			keys.push({ t: cut, cx: last.cx, cy: last.cy, w: last.w })
			keys.push({ t: dur - 0.05, cx: keys[0].cx, cy: keys[0].cy, w: keys[0].w })
			S.camera(tl, '#e-cam', keys, 972, 810, 'sine.inOut')

			var hops = S.json(V.hops, [])
			hops.forEach(function (h, i) {
				var chip = document.createElement('span')
				chip.className = 'chip'
				chip.id = 'e-chip' + i
				chip.setAttribute('data-layout-allow-occlusion', '')
				chip.setAttribute('data-layout-allow-overflow', '')
				chip.textContent = (i + 1) + '  ' + h.label
				$('e-chips').appendChild(chip)
				tl.fromTo(chip, { y: 260 }, { y: 0, duration: 0.4, ease: 'power3.out' }, h.t)
				tl.to(chip, { y: 260, duration: 0.3, ease: 'power2.in' }, cut - 0.3)
			})
			S.rings(tl, $('e-cam'), hops.filter(function (h) { return h.ring }).map(function (h) { var r = h.ring; return { t: h.t, d: 1.2, cx: r.cx, cy: r.cy, w: r.w, h: r.h } }))

			// The clock: the video's own time, from the first frame to the loop cut.
			if (V.timer) {
				$('e-tlab').textContent = V.timer
				var p = { v: 0 }
				var show = function () {
					var s = Math.max(0, p.v)
					$('e-time').textContent = '00:' + (s < 10 ? '0' : '') + s.toFixed(1)
				}
				tl.to(p, { v: cut, duration: cut, ease: 'none', onUpdate: show }, 0)
				tl.to(p, { v: 0, duration: 0.01, ease: 'none', onUpdate: show }, cut)
			} else {
				$('e-clock').style.display = 'none'
			}
			window.__timelines['tpl-e'] = tl
		})()
	</script>
</template>
</body>
</html>
