<!doctype html>
<!-- Story scene "story-2am-night" (voiced story, episode 04-flow-2am): the DRAWN 2 a.m. bedroom. Nothing here is Insilode's UI: a
     phone with a made-up on-call notice, an alarm clock, a mug, the pixel cat, and (open mode) paper cards for the
     service names, the grep and the first hit. The service names, the file name, the grep count (31 matches of
     `grep -rni invoice` over the demo project) and the code lines are the demo project's real ones.
     The three scenes story-2am-night (open), story-2am-close and story-2am-end share this room; the mode is open.
     Times come from the episode (`beats`); the layout lives here. -->

{"id":"beats","type":"string","label":"Times (JSON)","default":"{}"},

]'>

		#nt-grep .cmd { font-family: var(--mono); font-weight: 700; font-size: 32px; color: #2a2318; margin-bottom: 14px; white-space: nowrap; }
		#nt-grep .row { font-family: var(--mono); font-size: 28px; line-height: 1; padding: 9px 8px 11px; color: #2a2318; white-space: nowrap; opacity: 0; letter-spacing: -0.03em; }
		#nt-grep .row.first { position: relative; }
		#nt-hl { position: absolute; left: 14px; top: 0; width: 840px; height: 50px; background: #ffe56b; opacity: 0; z-index: 0; border-radius: 6px; }
		#nt-grep .row { position: relative; z-index: 1; }
		#nt-count { position: absolute; left: 26px; bottom: 26px; font-family: var(--sans); font-weight: 700; font-size: 72px; line-height: 1; color: #d01e2a; letter-spacing: -0.02em; padding: 4px 26px 12px; border: 7px solid #d01e2a; border-radius: 50%; opacity: 0; transform: rotate(-3deg); }
		.tabear { position: absolute; left: 44px; top: 44px; width: 560px; height: 90px; background: #f3ead6; border-radius: 12px 12px 0 0; display: flex; align-items: center; padding: 0 26px; }
		.tabear b { font-family: var(--mono); font-weight: 650; font-size: 38px; color: #2a2318; white-space: nowrap; letter-spacing: -0.02em; }
		#nt-hit .body { position: absolute; left: 44px; top: 134px; width: 740px; height: 330px; background: #f3ead6; border-radius: 0 18px 18px 18px; box-shadow: 0 10px 22px rgba(0, 0, 0, .45); padding: 30px 28px; }
		#nt-hit .code { font-family: var(--mono); font-size: 30px; line-height: 1.5; color: #2a2318; white-space: pre; letter-spacing: -0.03em; }
		#nt-hit .code mark { background: #ffe56b; color: #2a2318; padding: 0 4px; }
		#nt-stamp { position: absolute; left: 150px; top: 520px; font-family: var(--mono); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: .02em; color: #ff6b7d; border: 12px solid #ff6b7d; border-radius: 22px; padding: 12px 30px 18px; background: rgba(27, 27, 34, .94); opacity: 0; transform: rotate(-7deg); }
	</style>
	<div id="root" data-composition-id="story-2am-night" data-width="1080" data-height="1920">

		<div id="nt-panel" class="panel">
			<div id="nt-roomg" style="position: absolute; inset: 0;">
			<svg id="nt-room" viewBox="0 0 972 810" aria-hidden="true">
				<rect x="60" y="50" width="250" height="300" rx="10" fill="#0b1230" stroke="#6b4a2b" stroke-width="14"/>
				<line x1="185" y1="50" x2="185" y2="350" stroke="#6b4a2b" stroke-width="10"/>
				<line x1="60" y1="200" x2="310" y2="200" stroke="#6b4a2b" stroke-width="10"/>
				<circle cx="125" cy="120" r="34" fill="#f5e7b0"/><circle cx="139" cy="110" r="30" fill="#0b1230"/>
				<circle cx="240" cy="110" r="4" fill="#f5e7b0"/><circle cx="260" cy="270" r="4" fill="#f5e7b0"/><circle cx="120" cy="290" r="4" fill="#f5e7b0"/>
				<path d="M600 650 Q 760 610 972 640 V810 H600Z" fill="#26356e" stroke="#0a0e1c" stroke-width="6"/>
				<path d="M640 700 Q 780 680 972 700" fill="none" stroke="#3b4a8c" stroke-width="6"/>
				<rect x="40" y="560" width="580" height="250" fill="#5a3d25" stroke="#0a0e1c" stroke-width="6"/>
				<rect x="20" y="540" width="620" height="36" rx="6" fill="#7a5333" stroke="#0a0e1c" stroke-width="6"/>
				<rect x="470" y="450" width="104" height="90" rx="10" fill="#e8e2d2" stroke="#0a0e1c" stroke-width="6"/>

			<svg id="nt-buzz" viewBox="0 0 400 300" aria-hidden="true">
				<path id="nt-bz1" d="M30 70 q -26 80 0 160"/><path id="nt-bz2" d="M-4 40 q -50 110 0 220"/>

public String invoice(Long id) {
    return service.<mark>invoiceFor</mark>(id);
}</div></div>

	<script>
		(function () {
			var V = Shorts.vars('story-2am-night'), S = Shorts
			var tl = gsap.timeline({ paused: true })
			var $ = function (id) { return document.getElementById(id) }
			var MODE = 'open'
			var B = S.json(V.beats, {})
			var dur = V.duration

			// Big text: the first beat is fully formed at frame 0; later beats rise into their own clip box and leave upward.
			var texts = S.json(V.texts, [])
			texts.forEach(function (b, i) {
				var box = document.createElement('div')
				box.className = 'q hl'
				box.setAttribute('data-layout-allow-overlap', '')
				box.setAttribute('data-layout-allow-occlusion', '')
				$('nt-t').appendChild(box)
				var spans = S.lines(box, b.text, 'nt-t' + i)
				if (i > 0) {
					spans.forEach(function (sp) { [sp].concat([].slice.call(sp.querySelectorAll('*'))).forEach(function (e) { e.setAttribute('data-layout-allow-occlusion', '') }) })
					tl.set(spans, { yPercent: 108 }, 0)
					S.rise(tl, spans, b.t)
				}
				var next = texts[i + 1]
				if (next) S.leave(tl, spans, next.t - 0.4)
			})

			// The layers (service names, grep, first hit) wait below the panel's bottom edge.
			gsap.set(['#nt-l2a', '#nt-l2b', '#nt-l2c'], { yPercent: 102, visibility: 'hidden' })

			if (MODE === 'open') {
				// The page: the phone shakes, drawn buzz arcs flick on and off with it.
				;(B.buzz || []).forEach(function (t) {
					tl.fromTo('#nt-phone', { rotation: 0 }, { rotation: 3, duration: 0.05, repeat: 11, yoyo: true, ease: 'none', transformOrigin: '50% 100%' }, t)
					;['bz1', 'bz2', 'bz3', 'bz4'].forEach(function (id, k) {
						tl.set('#nt-' + id, { opacity: 1 }, t + (k % 2) * 0.05)
						tl.set('#nt-' + id, { opacity: 0 }, t + 0.3 + (k % 2) * 0.05)
						tl.set('#nt-' + id, { opacity: 1 }, t + 0.35)
						tl.set('#nt-' + id, { opacity: 0 }, t + 0.6)
					})
				})
				// The cat looks at you.
				tl.to('#nt-pet', { rotation: 6, duration: 0.5, ease: 'power2.inOut' }, B.catTilt)

				// Which of the three services? A pointer hops down the cards, eeny meeny, and goes back to the first.
				var hop = function (i) { return 40 + i * 180 + 75 }
				tl.to('#nt-l2a', { yPercent: 0, duration: 0.45, ease: 'power3.out' }, B.services)
				tl.set('#nt-l2a', { visibility: 'visible' }, B.services - 0.01)
				tl.set('#nt-roomg', { visibility: 'hidden' }, B.services + 0.5)
				tl.to('#nt-pet', { y: 340, duration: 0.3, ease: 'power2.in' }, B.services - 0.1)
				var eeny = B.eeny || []
				var order = [0, 1, 2, 1, 2, 0]
				eeny.forEach(function (t, k) { tl.set('#nt-ptr', { y: hop(order[k % order.length]), opacity: 1 }, t) })

				// The cat peeks over the cards with its line.
				var peek = function (t, d, bub) {
					tl.to('#nt-pet', { y: 190, duration: 0.35, ease: 'power3.out' }, t - 0.3)
					tl.set(bub, { opacity: 1 }, t)
					tl.set(bub, { opacity: 0 }, t + d)
					tl.to('#nt-pet', { y: 340, duration: 0.3, ease: 'power2.in' }, t + d)
				}
				peek(B.c1, B.c1d, '#nt-bub')

				// 31 matches of the real grep: the rows appear one by one, then the count is circled.
				tl.to('#nt-l2b', { yPercent: 0, duration: 0.45, ease: 'power3.out' }, B.grep)
				tl.set('#nt-l2b', { visibility: 'visible' }, B.grep - 0.01)
				tl.set('#nt-l2a', { visibility: 'hidden' }, B.grep + 0.5)
				var rows = [].slice.call(document.querySelectorAll('#nt-grep .row'))
				rows.forEach(function (r, i) { tl.set(r, { opacity: 1 }, B.grep + 0.6 + i * 0.2) })
				tl.fromTo('#nt-count', { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'power3.out' }, B.count)

				// The first hit: the highlighter finds it, the paper opens, a stamp lands on it.
				tl.set('#nt-hl', { y: 78, opacity: 1 }, B.hit - 1.2)
				tl.to('#nt-l2c', { yPercent: 0, duration: 0.45, ease: 'power3.out' }, B.hit)
				tl.set('#nt-l2c', { visibility: 'visible' }, B.hit - 0.01)
				tl.set('#nt-l2b', { visibility: 'hidden' }, B.hit + 0.5)
				tl.fromTo('#nt-stamp', { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: 'power3.in' }, B.stamp)
				tl.fromTo('#nt-stamp', { x: -4 }, { x: 4, duration: 0.04, repeat: 4, yoyo: true, ease: 'none' }, B.stamp + 0.14)
				tl.set('#nt-stamp', { x: 0 }, B.stamp + 0.34)
				peek(B.c2, B.c2d, '#nt-bub2')
			}
			tl.to({}, { duration: dur }, 0)
			window.__timelines['story-2am-night'] = tl
		})()
	</script>
</template>
