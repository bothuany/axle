<!doctype html>
<!-- Story scene "agents" (voiced stories, episode 06-agent-waits): the reveal on real stills of the app's Agents dock page and
     its status island page (tools/capture-ep06-dock.mjs: headless, the Try page's three demo agents, the wait aged to 47 minutes).
     The stills are padded onto the 3840 x 2160 window every capture uses, so the camera and the rings work in window
     fractions as everywhere else. A shot is one still with its own camera keys and rings; shots swap hard, on a beat. A drawn
     pointer clicks the waiting agent's row (the dock's row opens that agent's terminal), and the pet peeks in on the answer. -->
<html lang="en" data-composition-variables='[
{"id":"dockUrl","type":"string","label":"Dock, the agent waiting","default":"assets/captures/R1-dock-needs.jpg"},
{"id":"islandUrl","type":"string","label":"Island, the agent waiting","default":"assets/captures/R3-island-needs.jpg"},
{"id":"dockOkUrl","type":"string","label":"Dock, after the answer","default":"assets/captures/R2-dock-allowed.jpg"},
{"id":"petUrl","type":"string","label":"Pet that peeks in on the answer","default":"assets/pets/bunny-work.png"},
{"id":"shots","type":"string","label":"Shots (JSON: t, img dock|island|dockOk, cam[], rings[])","default":"[]"},
{"id":"texts","type":"string","label":"Big text beats (JSON: t, text with | and *accent*)","default":"[]"},
{"id":"click","type":"string","label":"Pointer (JSON: shot, t, d, fx, fy: where it clicks, in window fractions)","default":"{}"},
{"id":"cameo","type":"number","label":"When the pet peeks in (s)","default":18.9},
{"id":"duration","type":"number","label":"Scene length (s)","default":24}
]'>
<body>
<template id="story-agents-template">
	<style>
		#root { position: absolute; inset: 0; }
		#a-texts .q { font-size: 100px; }
		#a-panel { left: var(--px); top: 480px; width: var(--pw); height: 810px; background: #0f0f0f; }
		.shot { position: absolute; inset: 0; overflow: hidden; display: none; }
		#a-ptr { position: absolute; left: 0; top: 0; width: 64px; height: 64px; z-index: 8; opacity: 0; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .6)); }
		#a-click { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 8px solid var(--entry); border-radius: 50%; opacity: 0; z-index: 7; }
		#a-pet { position: absolute; left: 772px; top: 292px; width: 188px; height: 188px; image-rendering: pixelated; border-radius: 26px; }
	</style>
	<div id="root" data-composition-id="story-agents" data-width="1080" data-height="1920">
		<div class="demo">demo project</div>
		<div id="a-texts"></div>
		<img id="a-pet" data-var-src="petUrl" src="assets/blank.png#p" alt="" data-layout-allow-overflow data-layout-allow-occlusion>
		<div id="a-panel" class="panel">
			<div id="a-s0" class="shot"><div id="a-c0" class="cam" data-layout-allow-overflow><img data-var-src="dockUrl" src="assets/blank.png#a0" alt=""></div></div>
			<div id="a-s1" class="shot"><div id="a-c1" class="cam" data-layout-allow-overflow><img data-var-src="islandUrl" src="assets/blank.png#a1" alt=""></div></div>
			<div id="a-s2" class="shot"><div id="a-c2" class="cam" data-layout-allow-overflow><img data-var-src="dockUrl" src="assets/blank.png#a2" alt=""></div></div>
			<div id="a-s3" class="shot"><div id="a-c3" class="cam" data-layout-allow-overflow><img data-var-src="dockOkUrl" src="assets/blank.png#a3" alt=""></div></div>
			<div id="a-click" data-layout-allow-overflow></div>
			<svg id="a-ptr" viewBox="0 0 24 24" data-layout-allow-overflow><path d="M3 2 L3 19 L8 14.5 L11.5 22 L14.5 20.6 L11 13.2 L18 13 Z" fill="#fff" stroke="#10142a" stroke-width="1.6" stroke-linejoin="round"/></svg>
		</div>
	</div>
	<script>
		(function () {
			var V = Shorts.vars('story-agents'), S = Shorts
			var tl = gsap.timeline({ paused: true })
			var $ = function (id) { return document.getElementById(id) }
			var PW = 972, PH = 810
			var dur = V.duration
			var shots = S.json(V.shots, [])

			// Shots: one still each, swapped hard on its beat; the camera and the rings are the shot's own.
			shots.forEach(function (sh, i) {
				var end = shots[i + 1] ? shots[i + 1].t : dur
				tl.set('#a-s' + i, { display: 'block' }, sh.t)
				tl.set('#a-s' + i, { display: 'none' }, end)
				var keys = sh.cam.map(function (k) { return Object.assign({}, k, { t: k.t }) })
				S.camera(tl, '#a-c' + i, keys, PW, PH)
				S.rings(tl, $('a-c' + i), sh.rings || [])
			})
			// The shots' first frames must exist before they are shown (the camera sets its first key at time 0 of the timeline).
			shots.forEach(function (sh, i) { tl.set('#a-c' + i, S.fit(sh.cam[0], PW, PH), sh.t) })

			// The pointer: in from the panel's bottom-right edge, onto the waiting agent's row, a click, out again the same way.
			var K = S.json(V.click, null)
			if (K) {
				var key = shots[K.shot].cam.filter(function (k) { return k.t <= K.t }).pop() || shots[K.shot].cam[0]
				var f = S.fit(key, PW, PH)
				var x = f.x + f.scale * K.fx * S.IW, y = f.y + f.scale * K.fy * S.IH
				gsap.set('#a-ptr', { x: PW + 40, y: PH + 40 })
				tl.set('#a-ptr', { opacity: 1 }, K.t - 1.0)
				tl.to('#a-ptr', { x: x, y: y, duration: 0.9, ease: 'power2.inOut' }, K.t - 0.95)
				gsap.set('#a-click', { x: x + 6, y: y + 8 })
				tl.fromTo('#a-click', { scale: 0.4, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, K.t)
				tl.fromTo('#a-ptr', { scale: 1 }, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, K.t - 0.02)
				tl.to('#a-ptr', { x: PW + 40, y: PH + 40, duration: 0.6, ease: 'power2.in' }, K.t + K.d)
			}

			// The pet peeks up from behind the panel's top edge on the answer, and stays until the end.
			gsap.set('#a-pet', { y: 200 })
			tl.to('#a-pet', { y: 0, duration: 0.4, ease: 'power3.out' }, V.cameo)
			tl.fromTo('#a-pet', { rotation: 0 }, { rotation: -6, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut', transformOrigin: '50% 100%' }, V.cameo + 0.5)

			// Big text: each beat rises into its own clip box and leaves upward before the next one.
			var texts = S.json(V.texts, [])
			texts.forEach(function (b, i) {
				var box = document.createElement('div')
				box.className = 'q hl'
				box.setAttribute('data-layout-allow-overlap', '')
				box.setAttribute('data-layout-allow-occlusion', '')
				$('a-texts').appendChild(box)
				var spans = S.lines(box, b.text, 'a-t' + i)
				spans.forEach(function (sp) { [sp].concat([].slice.call(sp.querySelectorAll('*'))).forEach(function (e) { e.setAttribute('data-layout-allow-occlusion', '') }) })
				tl.set(spans, { yPercent: 108 }, 0)
				S.rise(tl, spans, b.t)
				var next = texts[i + 1]
				if (next) S.leave(tl, spans, next.t - 0.4)
			})
			tl.to({}, { duration: dur }, 0)
			window.__timelines['story-agents'] = tl
		})()
	</script>
</template>
</body>
</html>
