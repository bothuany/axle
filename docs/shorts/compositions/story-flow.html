<!doctype html>
<!-- Story scene "flow" (voiced stories): the reveal on a real capture of the call-flow canvas. The camera rides the
     request in the order the code runs, a ring marks what the voice names, a chip lands per hop, and the big text
     changes per beat. The scene's first camera key must equal the chaos scene's `flowKey`, so the snapped cards land on
     the real nodes at the cut. Times are the scene's own (0 = the cut). -->
<html lang="en" data-composition-variables='[
{"id":"captureUrl","type":"string","label":"Flow capture","default":"assets/captures/B3-sidebar.jpg"},
{"id":"cam","type":"string","label":"Camera keys (JSON)","default":"[{\"t\":0,\"cx\":0.47,\"cy\":0.52,\"w\":0.64}]"},
{"id":"rings","type":"string","label":"Rings (JSON: t, d, cx, cy, w, h)","default":"[]"},
{"id":"hops","type":"string","label":"Hop chips (JSON: t, label)","default":"[]"},
{"id":"texts","type":"string","label":"Big text beats (JSON: t, text with | and *accent*)","default":"[]"},
{"id":"duration","type":"number","label":"Scene length (s)","default":16}
]'>
<body>
<template id="story-flow-template">
	<style>
		#root { position: absolute; inset: 0; }
		#f-texts .q { font-size: 100px; }
		#f-panel { left: var(--px); top: 480px; width: var(--pw); height: 810px; }
		#f-chips { position: absolute; left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
		#f-chips .chip { font-size: 32px; background: rgba(12, 16, 32, .92); }
	</style>
	<div id="root" data-composition-id="story-flow" data-width="1080" data-height="1920">
		<div class="demo">demo project</div>
		<div id="f-texts"></div>
		<div id="f-panel" class="panel">
			<div id="f-cam" class="cam" data-layout-allow-overflow><img data-var-src="captureUrl" src="assets/blank.png#f" alt=""></div>
			<div id="f-chips"></div>
		</div>
	</div>
	<script>
		(function () {
			var V = Shorts.vars('story-flow'), S = Shorts
			var tl = gsap.timeline({ paused: true })
			var $ = function (id) { return document.getElementById(id) }
			var dur = V.duration
			S.camera(tl, '#f-cam', S.json(V.cam, []), 972, 810)
			S.rings(tl, $('f-cam'), S.json(V.rings, []))

			// Big text: each beat rises into its own clip box and leaves upward before the next one.
			var texts = S.json(V.texts, [])
			texts.forEach(function (b, i) {
				var box = document.createElement('div')
				box.className = 'q hl'
				// The beats share one place; only one is inside its clip box at a time.
				box.setAttribute('data-layout-allow-overlap', '')
				box.setAttribute('data-layout-allow-occlusion', '')
				$('f-texts').appendChild(box)
				var spans = S.lines(box, b.text, 'f-t' + i)
				// Waiting below its clip box, a beat sits over the picture's top edge; it is not visible there.
				spans.forEach(function (sp) { [sp].concat([].slice.call(sp.querySelectorAll('*'))).forEach(function (e) { e.setAttribute('data-layout-allow-occlusion', '') }) })
				tl.set(spans, { yPercent: 108 }, 0)
				S.rise(tl, spans, b.t)
				var next = texts[i + 1]
				S.leave(tl, spans, next ? next.t - 0.4 : dur - 0.4)
			})

			// A chip per hop, stacked bottom-left; they leave down through the panel's edge together before the end.
			var hops = S.json(V.hops, [])
			hops.forEach(function (h, i) {
				var chip = document.createElement('span')
				chip.className = 'chip'
				chip.id = 'f-chip' + i
				chip.setAttribute('data-layout-allow-occlusion', '')
				chip.setAttribute('data-layout-allow-overflow', '')
				chip.textContent = h.label
				$('f-chips').appendChild(chip)
				tl.fromTo(chip, { y: 300 }, { y: 0, duration: 0.4, ease: 'power3.out' }, h.t)
				tl.to(chip, { y: 300, duration: 0.3, ease: 'power2.in' }, (h.out || dur - 1.6))
			})
			tl.to({}, { duration: dur }, 0)
			window.__timelines['story-flow'] = tl
		})()
	</script>
</template>
</body>
</html>
